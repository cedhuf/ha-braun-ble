name: CI

on:
  push:
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group dev ruff check .
      - run: uv run --group dev pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [hassfest, hacs, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check manifest version matches tag
        run: test "v$(jq -r .version custom_components/ha_braun_ble/manifest.json)" = "$GITHUB_REF_NAME"
      - run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          git log --format='- %s' "$previous..$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
