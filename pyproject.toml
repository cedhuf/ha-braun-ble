[project]
name = "ha-braun-ble"
version = "0.1.13"
description = "Home Assistant custom integration for Braun BLE health devices"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.0.0",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
