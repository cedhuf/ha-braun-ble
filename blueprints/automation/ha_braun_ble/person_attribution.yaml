blueprint:
  name: "Braun BLE - Attribute temperature reading to family member"
  description: >
    Sends an actionable notification with buttons on each Braun ThermoScan
    reading to assign the measurement to a specific family member.
  domain: automation
  input:
    notify_device:
      name: "Device to notify"
      description: "Mobile device running the Home Assistant app (iOS or Android)."
      selector:
        device:
          integration: mobile_app
    person_1_name:
      name: "Person 1 - Name"
      default: "Parent"
      selector:
        text:
    person_1_helper:
      name: "Person 1 - Storage Entity (input_number)"
      description: "Helper input_number entity storing this person's latest temperature."
      selector:
        entity:
          domain: input_number
    person_2_name:
      name: "Person 2 - Name"
      default: "Child"
      selector:
        text:
    person_2_helper:
      name: "Person 2 - Storage Entity (input_number)"
      description: "Helper input_number entity storing this person's latest temperature."
      selector:
        entity:
          domain: input_number

mode: restart

trigger:
  - platform: event
    event_type: ha_braun_ble_measurement

variables:
  temp: "{{ trigger.event.data.temperature }}"
  unit: "{{ trigger.event.data.unit | default('°C') }}"
  fever: "{{ trigger.event.data.fever_status | default('normal') }}"
  action_p1: "{{ 'ASSIGN_P1_' ~ context.id }}"
  action_p2: "{{ 'ASSIGN_P2_' ~ context.id }}"

action:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "🌡️ Braun Measurement: {{ temp }}{{ unit }}"
    message: "Fever status: {{ fever }}. Who is this temperature reading for?"
    data:
      actions:
        - action: "{{ action_p1 }}"
          title: !input person_1_name
        - action: "{{ action_p2 }}"
          title: !input person_2_name

  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_p1 }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_p2 }}"
    timeout: "01:00:00"
    continue_on_timeout: false

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger.event.data.action == action_p1 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input person_1_helper
            data:
              value: "{{ temp }}"
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger.event.data.action == action_p2 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input person_2_helper
            data:
              value: "{{ temp }}"
